<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="VOID — student, systems builder, co-founder of PX">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#E8EDEB" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="42%" cy="52%" r="60%">
      <stop offset="0" stop-color="#8AF5C0" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#8AF5C0" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#8AF5C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8AF5C0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8AF5C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#07090A"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <rect x="72" y="58" width="26" height="1" fill="#8AF5C0" opacity="0.7"/>
  <text x="110" y="63" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" letter-spacing="6" fill="#8A9591">X IN THE VOID</text>

  <text x="70" y="206" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="132" font-weight="700" letter-spacing="10" fill="#E8EDEB">VOID</text>
  <rect x="404" y="118" width="15" height="96" fill="#8AF5C0" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.05;0.85" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="72" y="234" width="620" height="1" fill="url(#line)"/>

  <text x="72" y="272" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="19" letter-spacing="1.2" fill="#8A9591">student · systems builder · co-founder of PX</text>
  <text x="72" y="322" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#59635F">BUILD IN THE DARK. LEAVE SYSTEMS BEHIND.</text>

  <g opacity="0.75">
    <text x="1216" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11" letter-spacing="5" fill="#59635F" transform="rotate(90 1216 118)">PX / VOIDX</text>
    <circle cx="1200" cy="262" r="3" fill="#8AF5C0"/>
    <path d="M1140 262H1188" stroke="#2A3233" stroke-width="1"/>
    <text x="1132" y="266" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11" letter-spacing="2" fill="#59635F">INDIA · UTC+5:30</text>
  </g>

  <rect x="0" y="0" width="1280" height="2" fill="#8AF5C0" opacity="0.05">
    <animate attributeName="y" values="-2;360;360" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.05;0.05;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
